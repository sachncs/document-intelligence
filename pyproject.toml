[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfsi-rbi"
version = "0.1.0"
description = "Grounded RAG agent for BFSI document intelligence over RBI circulars"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "sachin", email = "sachncs@gmail.com" },
]
keywords = [
    "rag",
    "agent",
    "bfsi",
    "rbi",
    "elasticsearch",
    "pydantic-ai",
    "litellm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic-ai>=0.3.0",
    "pydantic-ai-litellm>=0.2.0",
    "pydantic-evals>=0.3.0",
    "litellm>=1.50.0",
    "pypdf>=4.0.0",
    "pypdfium2>=4.0.0",
    "elasticsearch>=9.0.0,<10.0.0",
    "streamlit>=1.35.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "logfire>=0.50.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
bfsi-rbi = "bfsi_rbi.cli.main:app"

[project.urls]
Homepage = "https://github.com/sachin/bfsi-rbi"
Documentation = "https://sachin.github.io/bfsi-rbi"
Repository = "https://github.com/sachin/bfsi-rbi"
Issues = "https://github.com/sachin/bfsi-rbi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bfsi_rbi"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bfsi_rbi",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "tests",
    "docs",
    "eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/bfsi_rbi/ui/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["logfire"]
ignore_missing_imports = true

[tool.pytest]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires live Elastic / MiniMax / Network",
    "slow: takes more than 5 seconds",
]

[tool.coverage.run]
source = ["src/bfsi_rbi"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
