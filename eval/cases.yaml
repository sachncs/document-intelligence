- name: cross_lcr_definition_bank_vs_nbfc
  inputs: How does the Liquidity Coverage Ratio definition differ between commercial banks and NBFCs?
  expected_output: |
    For commercial banks, LCR is set at 100% of net cash outflows over 30
    days. For NBFCs, the LCR threshold is 50% of net cash outflows over
    30 days, with a stricter High Quality Liquid Asset (HQLA) composition
    (50% in Level 1 assets). NBFCs have a lower LCR but stricter asset
    quality composition.
  metadata:
    topic: cross_circular
    domain: nbfc
    source_faq_url: https://www.rbi.org.in/scripts/NotificationUser.aspx
    source_circular_ids: ["RBI/2020-21/208", "RBI/2020-21/223"]

- name: cross_nri_repatriation_nre_vs_nro
  inputs: Compare repatriation rules for NRE and NRO accounts.
  expected_output: |
    NRE accounts allow full repatriation of both principal and interest
    without any ceiling. NRO accounts have limited repatriation up to
    USD 1 million per financial year (after applicable taxes) for
    legitimate purposes, subject to Form 15CA/CB certification.
  metadata:
    topic: cross_circular
    domain: nri_accounts
    source_faq_url: https://www.rbi.org.in/scripts/FAQView.aspx?Id=78
    source_circular_ids: ["RBI/2023-24/36"]

- name: cross_repo_rate_effect_deposit_vs_loan
  inputs: How does a repo rate hike affect deposit and loan rates differently?
  expected_output: |
    A repo rate hike typically causes:
    1. Loan rates to rise almost immediately — banks re-price MCLR/
       EBLR-linked loans at the next reset (usually 3-12 months).
    2. Deposit rates to rise with a lag (1-3 months) — banks wait for
       liquidity needs to increase before raising deposit rates.
    Net effect: Net Interest Margin (NIM) widens in favor of banks
    initially, then narrows as deposit rates catch up.
  metadata:
    topic: cross_circular
    domain: monetary_policy
    source_faq_url: https://www.rbi.org.in/scripts/FS_Overview.aspx?fn=2752
    source_circular_ids: ["RBI/2023-24/103"]

- name: factual_ombudsman_scheme
  inputs: What is the Reserve Bank Integrated Ombudsman Scheme (RB-IOS) 2021?
  expected_output: |
    The Reserve Bank Integrated Ombudsman Scheme (RB-IOS), 2021 integrates
    the three previous ombudsman schemes (banking, NBFC, digital) into a
    single scheme. It provides a free, quick, and fair grievance redressal
    mechanism for customers of all regulated entities, with a 30-day
    resolution target and a multi-tier escalation structure.
  metadata:
    topic: factual
    domain: customer_protection
    year: 2021
    source_faq_url: https://www.rbi.org.in/scripts/FAQView.aspx?Id=160
    source_circular_ids: ["RBI/2021-22/33"]
