site_name: docendo
site_description: Grounded RAG agent for RBI regulatory documents.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Evaluation: evaluation.md
  - Security: security.md
  - Performance: performance.md
  - Known gaps: KNOWN_GAPS.md
  - Contributing: contributing.md
  - API Reference:
      - Agent: api/agent.md
      - Retrieval: api/retrieval.md
      - Eval: api/eval.md
      - Ingestion: api/ingestion.md
      - Models: api/models.md
